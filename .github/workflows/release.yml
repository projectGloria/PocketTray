name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (win-x64, self-contained single file)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pubArgs = @('-c', 'Release', '-r', 'win-x64', '--self-contained', 'true',
                       '-p:PublishSingleFile=true', '-p:EnableCompressionInSingleFile=true', '-o', 'publish')
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $pubArgs += "-p:Version=$($env:GITHUB_REF_NAME -replace '^v', '')" }
          dotnet publish PocketTray.csproj @pubArgs
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }

      - name: Collect runtime files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force app-dist | Out-Null
          # Only what the app needs at run time: the exe and the loose separator icon it reads from disk.
          Copy-Item publish\PocketTray.exe app-dist\
          Copy-Item publish\x-mark-512.ico app-dist\

      - name: Make sure the release exists
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --generate-notes --title $env:GITHUB_REF_NAME
            if ($LASTEXITCODE -ne 0) { throw 'could not create the release' }
          }
          $global:LASTEXITCODE = 0

      - uses: projectGloria/GloriaSetup@v0.1.0
        with:
          app-dir: app-dist
          manifest: gloria.toml
          certificate: ${{ secrets.WINDOWS_PFX_BASE64 }}
          certificate-password: ${{ secrets.WINDOWS_PFX_PASSWORD }}
